  <meta name="twitter:description" content="Tenemos algo especial que compartir contigo.">
  <meta name="twitter:image" content="https://drewseratto97.github.io/carmen-andres-invitacion/preview-wedding.jpg">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ivory: #f8f3e9;
      --paper: #fffaf0;
      --gold: #b58a3b;
      --dark-gold: #80551f;
      --ink: #63451f;
    }

    html {
      min-height: 100%;
      background: var(--ivory);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px 18px;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 50% 45%,
          #fffdf8 0%, #f8f0df 58%, #ead9b7 100%);
    }

    .frame {
      position: relative;
      width: min(100%, 650px);
      min-height: min(760px, calc(100svh - 48px));
      padding: 34px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #d4b779;
      outline: 1px solid rgba(181, 138, 59, .25);
      outline-offset: -9px;
      background:
        linear-gradient(145deg,
          rgba(255,255,255,.5),
          rgba(246,231,202,.32));
    }

    .ornament {
      color: var(--gold);
      font-size: 26px;
      letter-spacing: 8px;
      margin-bottom: 34px;
    }

    .envelope {
      position: relative;
      width: min(100%, 430px);
      aspect-ratio: 1.48;
      margin: 0 auto 54px;
      filter: drop-shadow(0 18px 20px rgba(94, 67, 28, .13));
      animation: arrive .9s ease both;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      border: 1px solid #d7bb80;
      background: linear-gradient(135deg, #f7e8c8, #e8d1a3);
    }

    .envelope-paper {
      position: absolute;
      inset: 5% 5% 7%;
      border: 1px solid rgba(183, 142, 65, .45);
      background:
        linear-gradient(135deg, #fffdf6, #f5e9d2);
    }

    .envelope-left,
    .envelope-right,
    .envelope-bottom {
      position: absolute;
      inset: 0;
    }

    .envelope-left {
      background: linear-gradient(120deg, #f3e3c2, #fff6e4);
      clip-path: polygon(0 0, 50% 53%, 0 100%);
      border-left: 1px solid #c8a15b;
    }

    .envelope-right {
      background: linear-gradient(240deg, #f0dfbd, #fff7e8);
      clip-path: polygon(100% 0, 50% 53%, 100% 100%);
    }

    .envelope-bottom {
      background: linear-gradient(0deg, #e8d1a5, #f7e9cd);
      clip-path: polygon(0 100%, 50% 43%, 100% 100%);
      border-bottom: 1px solid #c6a05a;
    }

    .envelope-flap {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #f5e5c5, #e7d0a4);
      clip-path: polygon(0 0, 100% 0, 50% 57%);
      transform-origin: top center;
      z-index: 3;
      transition: transform .85s ease, opacity .65s ease;
    }

    .seal {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 49%;
      width: 82px;
      height: 82px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #f9e8b6;
      font-size: 38px;
      background:
        radial-gradient(circle at 35% 30%,
          #e5c577, #b48737 58%, #81551f 100%);
      border: 3px double #e4c77f;
      box-shadow:
        0 3px 8px rgba(73, 48, 16, .22),
        inset 0 0 0 4px rgba(255, 231, 165, .15);
      transition: opacity .3s ease, transform .4s ease;
    }

    .instruction {
      margin: 0 0 20px;
      color: #8a6b39;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .open-button {
      appearance: none;
      border: 1px solid #f1d69a;
      border-radius: 999px;
      padding: 17px 30px;
      min-width: 245px;
      color: #fffaf0;
      background: linear-gradient(135deg, #b88c3e, #80551f);
      box-shadow: 0 7px 20px rgba(117, 79, 27, .2);
      font: inherit;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .open-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(117, 79, 27, .27);
    }

    .open-button:focus-visible {
      outline: 3px solid #80551f;
      outline-offset: 4px;
    }

    .footer-ornament {
      margin-top: 38px;
      color: #b58a3b;
      font-size: 21px;
      letter-spacing: 6px;
    }

    .frame.opening .envelope-flap {
      transform: rotateX(180deg);
      opacity: .25;
    }

    .frame.opening .seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.5);
    }

    .frame.opening .envelope {
      transform: translateY(-10px);
      transition: transform .8s ease;
    }

    .open-button:disabled {
      opacity: .7;
      cursor: wait;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .frame {
        min-height: calc(100svh - 24px);
        padding: 28px 18px;
      }

      .envelope {
        margin-bottom: 42px;
      }

      .seal {
        width: 66px;
        height: 66px;
        font-size: 31px;
      }

      .instruction {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .open-button {
        min-width: 225px;
        padding: 16px 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="frame" id="cover">
    <div class="ornament" aria-hidden="true">✦</div>

    <div
      class="envelope"
      role="img"
      aria-label="Un sobre de invitación cerrado en tonos marfil y dorado"
    >
      <div class="envelope-back"></div>
      <div class="envelope-paper"></div>
      <div class="envelope-left"></div>
      <div class="envelope-right"></div>
      <div class="envelope-bottom"></div>
      <div class="envelope-flap"></div>
      <div class="seal" aria-hidden="true">❧</div>
    </div>

    <p class="instruction">Una invitación especial para ti</p>

    <button class="open-button" id="openInvitation" type="button">
      ABRIR INVITACIÓN &nbsp; →
    </button>

    <div class="footer-ornament" aria-hidden="true">— ❦ —</div>
  </main>

  
<script>
  (() => {
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzjboMtl3Piipz0Zwm8mN5tDEFvhQeeWpzr9hhWNmRRECykQ9y934BsjsZECsQPYuPsMA/exec";

    const currentUrl = new URL(window.location.href);
    const guestId = currentUrl.searchParams.get("id")?.trim();

    const button = document.getElementById("openInvitation");
    const cover = document.getElementById("cover");

    button.addEventListener("click", () => {
      if (!guestId) {
        alert(
          "Esta invitación no tiene un ID asignado. " +
          "Abre el enlace personalizado que recibiste."
        );
        return;
      }

      button.disabled = true;
      button.textContent = "ABRIENDO TU INVITACIÓN…";
      cover.classList.add("opening");

      const destination = new URL(SCRIPT_URL);
      destination.searchParams.set("id", guestId);

      window.location.assign(destination.href);
    });
  })();
</script>
